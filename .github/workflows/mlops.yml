name: Self-Healing MLOps Pipeline

on:
  schedule:
    # Run drift monitoring every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual triggers

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only; no writes back to the repo
      actions: write   # required to upload artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python -m src.generate_data

      - name: Run drift monitor and auto-retrain
        run: python -m src.retrain_trigger

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: drift-report
          path: data/drift_report.json

      - name: Upload retrained model (if any)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: retrained-models
          path: models/*.pkl
          if-no-files-found: ignore
